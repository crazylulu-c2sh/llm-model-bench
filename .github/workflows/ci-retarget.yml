name: CI retarget

# 스택 PR의 부모가 머지되면 GitHub이 자식 PR의 base를 main으로 바꾸는데, 이건 `edited`로만 온다 —
# 기본 types에 없어 ci.yml이 한 번도 안 돈 채 머지 가능 상태가 된다(#156).
# `edited`는 제목·본문 수정에도 오므로 base가 실제로 바뀐 경우에만 ci.yml을 호출한다.
# 파일을 나눈 이유: ci.yml이 `edited`를 직접 받으면 본문 수정마다 같은 이름의 스킵 체크가 생겨 정상 결과를
# 가리고(필수 체크에선 스킵이 통과로 간주됨), 같은 concurrency 그룹의 진행 중인 실행까지 취소했다(#229·#230).
# 여기서 스킵되는 체크는 이름이 `retarget`이라 ci.yml의 체크를 가리지 않는다.
on:
  pull_request:
    types: [edited]
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: retarget
    # 호출된 워크플로도 이 이벤트의 `github` 컨텍스트를 그대로 받는다 — ci.yml 잡에 같은 조건을 두지 말 것.
    if: github.event.changes.base != null
    uses: ./.github/workflows/ci.yml
