packages:
  - "apps/*"
  - "packages/*"

# pnpm 11: package.json 의 "pnpm" 필드는 더 이상 읽지 않음 — 빌드 스크립트 허용은 여기서만 관리.
# (구 `pnpm.onlyBuiltDependencies` 는 v11 에서 제거됐고 allowBuilds 가 대체한다.)
# sharp = 비전 자산 전처리(prepare:vision), esbuild = tsup/vite 번들러 네이티브 바이너리.
allowBuilds:
  esbuild: true
  sharp: true

# Dependabot 취약점 대응 — 직접 의존성이 아닌 transitive 패키지를 강제 고정.
# 상위 패키지(tsup/eslint-plugin-jsx-a11y 등)가 아직 patched 버전을 요구하지 않아 override 필요.
overrides:
  brace-expansion@1: ^1.1.18
  brace-expansion@5: ^5.0.9
  nanoid: ^3.3.18
  postcss: ^8.5.23
  fast-uri: ^3.1.5
  ip-address: ^10.3.1
  esbuild: ^0.28.1
