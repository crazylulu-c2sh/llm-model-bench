services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      PORT: "20080"
      BENCH_DB_PATH: /data/bench.sqlite
      # 인증(opt-in). 켜면 nginx/mcp가 비루프백으로 보이므로 BENCH_TRUST_PROXY 또는 키가 필요.
      BENCH_API_KEYS: ${BENCH_API_KEYS:-}
      BENCH_TRUST_PROXY: ${BENCH_TRUST_PROXY:-}
      BENCH_CORS_ORIGINS: ${BENCH_CORS_ORIGINS:-}
    volumes:
      - bench_data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # streamable-HTTP MCP 서버 — 벤치 API를 프록시. 기본은 포트 미공개(loopback-safe);
  # 원격 에이전트에 노출하려면 아래 ports를 열고 MCP_HTTP_TOKEN을 반드시 설정한다.
  # 주의: compose 네트워크에서 mcp→api는 비루프백이므로 BENCH_API_KEYS를 켜면
  # 반드시 BENCH_API_KEY(=키 중 하나)를 mcp에 주거나 api에 BENCH_TRUST_PROXY로 처리할 것.
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_PORT: "20090"
      BENCH_API_URL: http://api:20080
      BENCH_API_VERSION: /api/v1
      BENCH_API_KEY: ${BENCH_API_KEY:-}
      MCP_HTTP_TOKEN: ${MCP_HTTP_TOKEN:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
    # ports:
    #   - "20090:20090"   # 원격 노출 시에만 활성화(+ MCP_HTTP_TOKEN 필수)
    depends_on:
      - api
    restart: unless-stopped

  # LAN 송신 프록시(폴백) — macOS 전용 문제의 우회로. **compose 배포에는 불필요하다**
  # (컨테이너가 이미 Linux VM 안이라 로컬 네트워크 게이트가 없다). 호스트에서 pm2로
  # 서버를 돌릴 때, 공유 프록시(127.0.0.1:3128)가 없거나 유휴 한도가 부족한 경우에만 쓴다.
  #   docker compose --profile lan-proxy up -d lan-proxy-fallback
  lan-proxy-fallback:
    build:
      context: .
      dockerfile: docker/lan-proxy/Dockerfile
    # PROXY_IDLE_MS 를 여기에 두지 않는다 — 기본값의 단일 출처는 docker/lan-proxy/proxy.js 다.
    # 두 곳에 적으면 서버의 MAX_REQUEST_TIMEOUT_MS 를 올릴 때 한쪽만 고쳐져 조용히 어긋난다.
    ports:
      - "127.0.0.1:3129:3129"   # 루프백 전용. 0.0.0.0 으로 열면 LAN 오픈 프록시가 된다.
    profiles: ["lan-proxy"]     # opt-in — 기본 `docker compose up` 에는 뜨지 않는다
    restart: unless-stopped

volumes:
  bench_data:
